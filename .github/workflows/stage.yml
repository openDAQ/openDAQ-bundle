name: Stage

# The bundle's installers, built by bundle.yml and published to ghcr.io/<owner>/bundle/native, identified by the
# commits they are built from: from the bundle's main and release/**, by a push or by hand (the inputs given make an
# identity of their own; skip-staging-push builds only, the installers kept as artifacts of the run). Not checked
# here: ci.yml checks the pull request that brought them.

on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      mqtt-module:
        description: "MQTTStreamingModule: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      asam-cmp-modules:
        description: "ASAM-CMP-Modules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      exclude-stagings:
        description: "Stagings left out of the bundle, e.g. opcua-modules (;-separated; never opendaq)"
        type: string
        default: ""
      skip-staging-push:
        description: "Build only, keep the installers as artifacts of the run"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  bundle:
    name: Bundle
    permissions:
      contents: read
      packages: write     # a missing staging's stage.yml asks for it; nothing is pushed from here
    uses: ./.github/workflows/bundle.yml
    with:
      opendaq: ${{ inputs.opendaq }}
      opcua-modules: ${{ inputs.opcua-modules }}
      mqtt-module: ${{ inputs.mqtt-module }}
      lt-streaming-modules: ${{ inputs.lt-streaming-modules }}
      asam-cmp-modules: ${{ inputs.asam-cmp-modules }}
      exclude-stagings: ${{ inputs.exclude-stagings }}

  push:
    name: Push
    needs: bundle
    if: >-
      github.repository == 'openDAQ/openDAQ-bundle'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && !inputs.skip-staging-push
    permissions:
      contents: read
      packages: write
    uses: openDAQ/openDAQ-CI/.github/workflows/staging-push.yml@v4
    with:
      staging-packages: ${{ needs.bundle.outputs.staging-push }}
