name: Assemble the bundle

# The bundle's installers assembled from stagings, without compiling. Every staging comes as an artifact: those of
# the bundle's revisions (CMakePresets.json, the preset "revisions") from the registry, by staging-pull, one
# artifact per staging and triplet, staging-<staging>-<triplet>; a module's is asked for by the core it was built
# against too, so the modules of one bundle share its core. reusable.yml builds each platform as the stagings were
# built: the stagings unpacked each into its own folder, given to the bundle as FETCHLAYER_PREFIX_<STAGING>
# (configure preset bundle-prefixes), the installer packed (package preset installer). Each installer is then
# installed as a user would and smoke-checked by tests/installed.
#
# A layer's revision can be given as an input (a commit, or a branch or tag taken at its head now), in place of the
# preset's. A caller that has built a staging in its own run (a PR of the core or a module) names its artifact in
# `artifacts`; that staging is not pulled. A staging the registry lacks fails the pull: it is staged first.

on:
  workflow_dispatch:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: the preset's revision)"
        type: string
        default: ""
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: the preset's)"
        type: string
        default: ""
      mqtt-module:
        description: "MQTTStreamingModule: a commit, branch or tag (empty: the preset's)"
        type: string
        default: ""
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: the preset's)"
        type: string
        default: ""
      asam-cmp-modules:
        description: "ASAM-CMP-Modules: a commit, branch or tag (empty: the preset's)"
        type: string
        default: ""
  workflow_call:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: the preset's revision)"
        type: string
        default: ""
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: the preset's)"
        type: string
        default: ""
      mqtt-module:
        description: "MQTTStreamingModule: a commit, branch or tag (empty: the preset's)"
        type: string
        default: ""
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: the preset's)"
        type: string
        default: ""
      asam-cmp-modules:
        description: "ASAM-CMP-Modules: a commit, branch or tag (empty: the preset's)"
        type: string
        default: ""
      artifacts:
        description: >-
          Stagings the caller built in this run, as artifacts, not pulled: a JSON object, staging → artifact name,
          {job} for the job, e.g. {"opcua-modules": "staging-{job}"}; their revision is the caller's
        type: string
        default: "{}"
      bundle-ref:
        description: "The bundle's commit, branch or tag to assemble with (a caller's run checks out the caller)"
        type: string
        default: main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    name: Resolve the stagings
    runs-on: ubuntu-latest
    outputs:
      staging-artifacts: ${{ steps.stagings.outputs.staging-artifacts }}
      jobs: ${{ steps.stagings.outputs.jobs }}
      packages: ${{ steps.stagings.outputs.packages }}
      cmake-presets: ${{ steps.stagings.outputs.cmake-presets }}
      cpack-presets: ${{ steps.stagings.outputs.cpack-presets }}
      checks: ${{ steps.stagings.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: openDAQ/openDAQ-bundle
          ref: ${{ github.repository == 'openDAQ/openDAQ-bundle' && github.sha || inputs.bundle-ref }}

      - name: Request the stagings
        id: stagings
        shell: python3 {0}
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          import json, os, re, subprocess, sys

          REGISTRY = "ghcr.io/openDAQ/dev/staging"
          # a reusable.yml job → the triplet of the stagings it takes, the installer it packs, and where that
          # installer is installed and checked (the runner, how many modules load: ASAM's need Npcap on Windows).
          # Linux takes the manylinux stagings, as the wheels are built: packing compiles nothing, so the DEB is
          # packed on Ubuntu, and its Depends are Ubuntu's
          JOBS = {
              "ubuntu-22.04-x86_64-ninja-gcc-release":       ("x86_64-manylinux_2_28-gcc-14-release", "DEB",          "ubuntu-22.04",     14),
              "ubuntu-22.04-armv8-ninja-gcc-release":        ("armv8-manylinux_2_28-gcc-14-release",  "DEB",          "ubuntu-24.04-arm", 14),
              "windows-2022-x86_64-msvs-v143-release":       ("x86_64-windows-msvc-143-release",      "NSIS",         "windows-2022",     12),
              "macos-26-armv8-ninja-appleclang-21-release":  ("armv8-macos-apple-clang-21-release",   "productbuild", "macos-26",         14),
              "macos-26-x86_64-ninja-appleclang-21-release": ("x86_64-macos-apple-clang-21-release",  "productbuild", "macos-26-intel",   14),
          }
          # a layer's revision variable → its staging, and the staging's repository
          STAGINGS = {"OPENDAQ": "opendaq", "OPCUAMODULES": "opcua-modules", "MQTTSTREAMINGMODULE": "mqtt-module",
                      "LTSTREAMINGMODULESMODERN": "lt-streaming-modules", "ASAM-CMP-MODULES": "asam-cmp-modules"}
          REPOSITORIES = {"opendaq": "openDAQ", "opcua-modules": "OpcUaModules", "mqtt-module": "MQTTStreamingModule",
                          "lt-streaming-modules": "LTStreamingModulesModern", "asam-cmp-modules": "ASAM-CMP-Modules"}

          inputs = json.loads(os.environ["INPUTS"] or "{}") or {}
          local = json.loads(inputs.get("artifacts") or "{}")
          if unknown := set(local) - set(REPOSITORIES):
              sys.exit(f"::error::artifacts names no staging of the bundle: {sorted(unknown)}")

          def commit(staging, ref):
              """A full sha as it is; a branch or a tag → its commit, as the repository has it now."""
              if re.fullmatch(r"[0-9a-f]{40}", ref):
                  return ref
              url = f"https://github.com/openDAQ/{REPOSITORIES[staging]}.git"
              out = subprocess.run(["git", "ls-remote", url, ref], capture_output=True, text=True, check=True).stdout
              refs = dict(reversed(line.split("\t")) for line in out.splitlines())
              for name in (f"refs/tags/{ref}^{{}}", f"refs/tags/{ref}", f"refs/heads/{ref}"):
                  if name in refs:
                      return refs[name]
              sys.exit(f"::error::{REPOSITORIES[staging]} has no branch or tag {ref!r} (a commit is given in full)")

          # the preset's revisions, each replaced by an input that is set
          presets = json.load(open("CMakePresets.json"))["configurePresets"]
          revisions = next(p for p in presets if p["name"] == "revisions")["cacheVariables"]
          revision = {}
          for variable, ref in revisions.items():
              staging = STAGINGS[variable.removeprefix("BUNDLE_REVISION_")]
              given = (inputs.get(staging) or "").strip()
              revision[staging] = commit(staging, given or ref)

          summary = ["| Staging | Revision | From |", "|-|-|-|"]
          for staging, sha in revision.items():
              source = f"this run, `{local[staging]}`" if staging in local else "ghcr"
              summary.append(f"| {staging} | [`{sha[:12]}`](https://github.com/openDAQ/{REPOSITORIES[staging]}/commit/{sha}) | {source} |")
          print("\n".join(summary))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(summary) + "\n")

          pull, packages, cmake_presets, cpack_presets, checks = [], [], [], [], []
          for job, (triplet, generator, runner, modules) in JOBS.items():
              # the packages are named by the stagings' triplet, not by the one this job would compose
              artifacts, prefixes = [], {"BUNDLE_TRIPLET": triplet}
              for staging, sha in revision.items():
                  if staging in local:
                      name = local[staging].replace("{job}", job)
                  else:
                      # a module's staging is asked for by the core it was built against too, so the modules of one
                      # bundle share its core
                      annotations = {"org.opencontainers.image.revision": sha, "com.opendaq.package.triplet": triplet}
                      if staging != "opendaq":
                          annotations["com.opendaq.dependencies.opendaq.revision"] = revision["opendaq"]
                      name = f"staging-{staging}-{triplet}"
                      pull.append({"artifact": name, "packages": [{"path": f"{REGISTRY}/{staging}", "annotations": annotations}]})
                  artifacts.append({"name": name, "dir": f"stagings/{staging}"})
                  # the core's tarball carries its install prefix, opt/opendaq, except on Windows
                  inside = "/opt/opendaq" if staging == "opendaq" and not job.startswith("windows-") else ""
                  prefixes[f"FETCHLAYER_PREFIX_{staging.upper()}"] = "${sourceDir}/stagings/" + staging + inside
              packages.append({"match-jobs": [job], "artifacts": artifacts})
              cmake_presets.append({"match-jobs": [job], "configure-preset": "bundle-prefixes", "cache-variables": prefixes})
              cpack_presets.append({"match-jobs": [job], "installers": [{"name": "bundle", "package": generator, "package-preset": "installer"}]})
              checks.append({"job": job, "runner": runner, "generator": generator, "modules": modules})

          # DEB names the libraries the stagings need in its Depends (dpkg-shlibdeps), so they must be there: ASAM's
          # libpcap, ref_fb's renderer's X11, GL, udev and freetype, LT's OpenSSL; NSIS packs
          packages += [{"match-jobs": ["ubuntu-*"], "apt-install": ["dpkg-dev", "file", "libpcap0.8", "libx11-6",
                         "libxrandr2", "libxcursor1", "libxi6", "libgl1", "libudev1", "libfreetype6", "libssl3"]},
                       {"match-jobs": ["windows-*"], "choco-install": ["nsis"]}]

          outputs = {"staging-artifacts": pull, "jobs": list(JOBS), "packages": packages,
                     "cmake-presets": cmake_presets, "cpack-presets": cpack_presets, "checks": checks}
          print(json.dumps(outputs, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for key, value in outputs.items():
                  f.write(f"{key}={json.dumps(value)}\n")

  pull:
    name: Pull
    needs: resolve
    if: needs.resolve.outputs.staging-artifacts != '[]'
    uses: openDAQ/openDAQ-CI/.github/workflows/staging-pull.yml@v4
    with:
      staging-artifacts: ${{ needs.resolve.outputs.staging-artifacts }}

  build:
    name: Build
    needs: [resolve, pull]
    if: ${{ !failure() && !cancelled() }}     # also when every staging came from the caller and nothing was pulled
    uses: openDAQ/openDAQ-CI/.github/workflows/reusable.yml@bundle/extract-each-artifact-into-its-dir
    with:
      include-jobs: ${{ needs.resolve.outputs.jobs }}
      packages: ${{ needs.resolve.outputs.packages }}
      cmake-presets: ${{ needs.resolve.outputs.cmake-presets }}
      cpack-presets: ${{ needs.resolve.outputs.cpack-presets }}

  # installed as a user would, everything selected, and smoke-checked
  check:
    name: Check ${{ matrix.check.job }}
    needs: [resolve, build]
    runs-on: ${{ matrix.check.runner }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.resolve.outputs.checks) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: openDAQ/openDAQ-bundle
          ref: ${{ github.repository == 'openDAQ/openDAQ-bundle' && github.sha || inputs.bundle-ref }}

      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.check.job }}
          path: installer

      - name: Install
        id: install
        timeout-minutes: 10
        run: |
          find installer -type f
          case "${{ matrix.check.generator }}" in
            DEB)          sudo apt-get update -qq
                          sudo apt-get install -y -qq "$(find "$PWD/installer" -name '*.deb' | head -1)"
                          echo "prefix=/opt/opendaq" >> "$GITHUB_OUTPUT" ;;
            productbuild) sudo installer -pkg "$(find installer -name '*.pkg' | head -1)" -target /
                          echo "prefix=/opt/opendaq" >> "$GITHUB_OUTPUT" ;;
            NSIS)         exe=$(cygpath -w "$(find installer -name '*.exe' | head -1)")
                          pwsh -Command 'Write-Host "PATH: $($env:Path.Length) characters (the template reads 1024)"'
                          pwsh -Command "Start-Process -Wait -FilePath '$exe' -ArgumentList '/S','/PATH=AllUsers','/D=C:\opendaq'"
                          echo "prefix=C:/opendaq" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Smoke check
        run: |
          cmake -S tests/installed -B build/installed \
                -DOPENDAQ_PREFIX=${{ steps.install.outputs.prefix }} -DEXPECT_MODULES=${{ matrix.check.modules }}
          cmake --build build/installed --config Release
          ctest --test-dir build/installed -C Release --output-on-failure

      # the installer added its bin to the machine's PATH, and the uninstaller removes it
      - name: PATH
        if: matrix.check.generator == 'NSIS'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $bin = 'C:\opendaq\bin'
          $has = { ([Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';') -contains $bin }
          Write-Host "after install, machine PATH has ${bin}: $(& $has)"
          if (-not (& $has)) { exit 1 }
          Start-Process -Wait -FilePath 'C:\opendaq\Uninstall.exe' -ArgumentList '/S','_?=C:\opendaq'
          Write-Host "after uninstall, machine PATH has ${bin}: $(& $has)"
          if (& $has) { exit 1 }
