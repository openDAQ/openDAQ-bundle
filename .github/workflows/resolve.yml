name: Resolve the bundle

# What the bundle is assembled of: a commit per layer and the platforms, and every staging laid into this run as an
# artifact, <staging>-staging-<job>, as a layer's stage names it, for assemble.yml to build from. The commits are
# bundle.json's, each replaced by an input that is set (a commit, or a branch or tag taken at its head now). The
# stagings come from the registry, by staging-pull, each from the channel its commit lies in (openDAQ-CI's
# resolve-channel: release/** stable, main dev, dev also for a commit on neither, staged by hand); a module's is asked
# for by the core it was built against too, so the modules of one bundle share its core. A staging the registry lacks
# is staged here by its layer's stage.yml, called, never pushed; a module after the core is in the run, which its
# stage then does not pull again.

on:
  workflow_call:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      mqtt-module:
        description: "MQTTStreamingModule: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      asam-cmp-modules:
        description: "ASAM-CMP-Modules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      exclude-stagings:
        description: "Stagings left out of the bundle, e.g. opcua-modules (;-separated; never opendaq)"
        type: string
        default: ""
    outputs:
      revisions:
        description: "The commit of each staging's layer: a JSON object, staging → full sha"
        value: ${{ jobs.resolve.outputs.revisions }}
      platforms:
        description: "The platforms: a JSON list of {job, triplet, generator, runner}"
        value: ${{ jobs.resolve.outputs.platforms }}

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    name: Resolve the stagings
    runs-on: ubuntu-latest
    outputs:
      revisions: ${{ steps.stagings.outputs.revisions }}
      platforms: ${{ steps.stagings.outputs.platforms }}
      exclude-jobs: ${{ steps.stagings.outputs.exclude-jobs }}
      staging-artifacts: ${{ steps.split.outputs.staging-artifacts }}
      missing: ${{ steps.split.outputs.missing }}
    steps:
      # bundle.json of this workflow's own commit, whoever calls it
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Resolve the commits
        id: stagings
        shell: python3 {0}
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          import json, os, re, subprocess, sys

          # one entry per platform the bundle is assembled for:
          #   key        the reusable.yml job that packs it (its name picks the runner, the compiler, the generator)
          #   triplet    the stagings it takes: com.opendaq.package.triplet of the packages pulled from ghcr
          #   generator  the CPack generator of its installer
          #   runner     where the installer is installed and smoke-checked (tests/installed); it serves the smoke
          #              check, a debugging aid until the integration tests take the installers, and goes with it
          JOBS = {
              # job                                          triplet                                 generator       runner
              "ubuntu-22.04-x86_64-ninja-gcc-release":       ("x86_64-linux-gcc-11-release",         "DEB",          "ubuntu-22.04"),
              "ubuntu-22.04-armv8-ninja-gcc-release":        ("armv8-linux-gcc-11-release",          "DEB",          "ubuntu-24.04-arm"),
              "windows-2022-x86_64-msvs-v143-release":       ("x86_64-windows-msvc-143-release",     "NSIS",         "windows-2022"),
              "macos-26-armv8-ninja-appleclang-21-release":  ("armv8-macos-apple-clang-21-release",  "productbuild", "macos-26"),
              "macos-26-x86_64-ninja-appleclang-21-release": ("x86_64-macos-apple-clang-21-release", "productbuild", "macos-26-intel"),
          }
          # the jobs of a layer's stage the bundle takes nothing from: not built when a layer is staged here
          EXCLUDE_JOBS = ["manylinux*", "windows-*-x86-*"]
          # a layer, named as its repository in bundle.json → its staging
          STAGINGS = {"openDAQ": "opendaq", "OpcUaModules": "opcua-modules", "MQTTStreamingModule": "mqtt-module",
                      "LTStreamingModulesModern": "lt-streaming-modules", "ASAM-CMP-Modules": "asam-cmp-modules"}
          REPOSITORIES = {staging: layer for layer, staging in STAGINGS.items()}

          inputs = json.loads(os.environ["INPUTS"] or "{}") or {}

          def commit(staging, ref):
              """A full sha as it is; a branch or a tag → its commit, as the repository has it now."""
              if re.fullmatch(r"[0-9a-f]{40}", ref):
                  return ref
              url = f"https://github.com/openDAQ/{REPOSITORIES[staging]}.git"
              out = subprocess.run(["git", "ls-remote", url, ref], capture_output=True, text=True, check=True).stdout
              refs = dict(reversed(line.split("\t")) for line in out.splitlines())
              for name in (f"refs/tags/{ref}^{{}}", f"refs/tags/{ref}", f"refs/heads/{ref}"):
                  if name in refs:
                      return refs[name]
              sys.exit(f"::error::{REPOSITORIES[staging]} has no branch or tag {ref!r} (a commit is given in full)")

          # the stagings left out; never the core, which the modules are built against
          excluded = [s.strip() for s in (inputs.get("exclude-stagings") or "").split(";") if s.strip()]
          if unknown := [s for s in excluded if s not in REPOSITORIES]:
              sys.exit(f"::error::exclude-stagings names {unknown}, which the bundle has not; it has {list(REPOSITORIES)}")
          if "opendaq" in excluded:
              sys.exit("::error::exclude-stagings leaves out opendaq, the core: the modules are built against it")

          # bundle.json's revisions, each replaced by an input that is set; the stagings left out dropped
          revision = {}
          for layer, ref in json.load(open("bundle.json"))["layers"].items():
              staging = STAGINGS[layer]
              if staging in excluded:
                  continue
              given = (inputs.get(staging) or "").strip()
              revision[staging] = commit(staging, given or ref)

          summary = ["| Staging | Revision |", "|-|-|"]
          for staging, sha in revision.items():
              summary.append(f"| {staging} | [`{sha[:12]}`](https://github.com/openDAQ/{REPOSITORIES[staging]}/commit/{sha}) |")
          print("\n".join(summary))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(summary) + "\n")

          platforms = [{"job": job, "triplet": triplet, "generator": generator, "runner": runner}
                       for job, (triplet, generator, runner) in JOBS.items()]
          # the modules' commits, by repository, for their channels
          modules = {f"openDAQ/{REPOSITORIES[staging]}": sha for staging, sha in revision.items() if staging != "opendaq"}

          outputs = {"revisions": revision, "platforms": platforms, "modules": modules, "exclude-jobs": EXCLUDE_JOBS,
                     "repositories": {staging: f"openDAQ/{layer}" for staging, layer in REPOSITORIES.items()}}
          print(json.dumps(outputs, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for key, value in outputs.items():
                  f.write(f"{key}={json.dumps(value)}\n")

      # the channel each staging is published in, by where its commit lies: the core's commit given as the commit,
      # the modules' as what it is built against, only to learn theirs (nothing is published here)
      - name: Resolve the channels
        id: channel
        uses: openDAQ/openDAQ-CI/.github/actions/resolve-channel@bundle/extract-each-artifact-into-its-dir
        with:
          repository: openDAQ/openDAQ
          commit: ${{ fromJSON(steps.stagings.outputs.revisions)['opendaq'] }}
          depends: ${{ steps.stagings.outputs.modules }}

      - name: Request the stagings
        id: request
        shell: python3 {0}
        env:
          REVISIONS: ${{ steps.stagings.outputs.revisions }}
          PLATFORMS: ${{ steps.stagings.outputs.platforms }}
          REPOSITORIES: ${{ steps.stagings.outputs.repositories }}
          CORE_CHANNEL: ${{ steps.channel.outputs.channel }}
          MODULE_CHANNELS: ${{ steps.channel.outputs.depends-channels }}
        run: |
          import json, os

          revision = json.loads(os.environ["REVISIONS"])
          repository = json.loads(os.environ["REPOSITORIES"])
          # a staging is looked for in its commit's channel, and in dev when it lies on no main or release/** (staged
          # by hand)
          channels = {"openDAQ/openDAQ": os.environ["CORE_CHANNEL"], **json.loads(os.environ["MODULE_CHANNELS"])}
          channel = {staging: channels[repository[staging]] or "dev" for staging in revision}

          # every staging of every platform, by its triplet, into an artifact named as the staging's own stage names
          # it; optional: the check tells what is there
          pull = []
          for platform in json.loads(os.environ["PLATFORMS"]):
              job, triplet = platform["job"], platform["triplet"]
              for staging, sha in revision.items():
                  annotations = {"org.opencontainers.image.revision": sha, "com.opendaq.package.triplet": triplet}
                  if staging != "opendaq":
                      annotations["com.opendaq.dependencies.opendaq.revision"] = revision["opendaq"]
                  pull.append({"artifact": f"{staging}-staging-{job}",
                               "packages": [{"path": f"ghcr.io/openDAQ/{channel[staging]}/staging/{staging}",
                                             "annotations": annotations, "optional": True}]})
          print(json.dumps(channel, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"request={json.dumps(pull)}\n")

      - name: Check the registry
        id: check
        uses: openDAQ/openDAQ-CI/.github/actions/staging-check@v4
        with:
          packages: ${{ steps.request.outputs.request }}

      # a staging missing on any platform is staged here, on all of them; the rest is pulled
      - name: Split
        id: split
        shell: python3 {0}
        env:
          REQUEST: ${{ steps.request.outputs.request }}
          RESOLVED: ${{ steps.check.outputs.resolved }}
        run: |
          import json, os

          request = json.loads(os.environ["REQUEST"])
          found = {entry["artifact"] for entry in json.loads(os.environ["RESOLVED"]) if entry["packages"]}
          staging_of = lambda entry: entry["packages"][0]["path"].rsplit("/", 1)[1]
          missing = sorted({staging_of(entry) for entry in request if entry["artifact"] not in found})

          pull = [{**entry, "packages": [{k: v for k, v in package.items() if k != "optional"} for package in entry["packages"]]}
                  for entry in request if staging_of(entry) not in missing]
          print(f"missing, staged here: {missing or 'none'}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"staging-artifacts={json.dumps(pull)}\n")
              f.write(f"missing={json.dumps(missing)}\n")

  pull:
    name: Pull
    needs: resolve
    if: needs.resolve.outputs.staging-artifacts != '[]'
    uses: openDAQ/openDAQ-CI/.github/workflows/staging-pull.yml@v4
    with:
      staging-artifacts: ${{ needs.resolve.outputs.staging-artifacts }}

  stage-opendaq:
    name: Stage openDAQ
    needs: resolve
    if: contains(fromJSON(needs.resolve.outputs.missing), 'opendaq')
    permissions:
      contents: read
      packages: write     # asked for by the stage.yml's push, which is never run from here
    uses: openDAQ/openDAQ/.github/workflows/stage.yml@bundle/stagings
    with:
      ref: ${{ fromJSON(needs.resolve.outputs.revisions)['opendaq'] }}
      exclude-jobs: ${{ needs.resolve.outputs.exclude-jobs }}

  # after the core is in the run, pulled or staged, so the module's stage does not pull it again
  stage-opcua-modules:
    name: Stage OpcUaModules
    needs: [resolve, pull, stage-opendaq]
    if: >-
      always() && needs.resolve.result == 'success'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.pull.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.stage-opendaq.result)
      && contains(fromJSON(needs.resolve.outputs.missing), 'opcua-modules')
    permissions:
      contents: read
      packages: write     # asked for by the stage.yml's push, which is never run from here
    uses: openDAQ/OpcUaModules/.github/workflows/stage.yml@bundle/stagings
    with:
      ref: ${{ fromJSON(needs.resolve.outputs.revisions)['opcua-modules'] }}
      opendaq-ref: ${{ fromJSON(needs.resolve.outputs.revisions)['opendaq'] }}
      exclude-jobs: ${{ needs.resolve.outputs.exclude-jobs }}

  stage-mqtt-module:
    name: Stage MQTTStreamingModule
    needs: [resolve, pull, stage-opendaq]
    if: >-
      always() && needs.resolve.result == 'success'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.pull.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.stage-opendaq.result)
      && contains(fromJSON(needs.resolve.outputs.missing), 'mqtt-module')
    permissions:
      contents: read
      packages: write     # asked for by the stage.yml's push, which is never run from here
    uses: openDAQ/MQTTStreamingModule/.github/workflows/stage.yml@bundle/stagings
    with:
      ref: ${{ fromJSON(needs.resolve.outputs.revisions)['mqtt-module'] }}
      opendaq-ref: ${{ fromJSON(needs.resolve.outputs.revisions)['opendaq'] }}
      exclude-jobs: ${{ needs.resolve.outputs.exclude-jobs }}

  stage-lt-streaming-modules:
    name: Stage LTStreamingModulesModern
    needs: [resolve, pull, stage-opendaq]
    if: >-
      always() && needs.resolve.result == 'success'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.pull.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.stage-opendaq.result)
      && contains(fromJSON(needs.resolve.outputs.missing), 'lt-streaming-modules')
    permissions:
      contents: read
      packages: write     # asked for by the stage.yml's push, which is never run from here
    uses: openDAQ/LTStreamingModulesModern/.github/workflows/stage.yml@bundle/stagings
    with:
      ref: ${{ fromJSON(needs.resolve.outputs.revisions)['lt-streaming-modules'] }}
      opendaq-ref: ${{ fromJSON(needs.resolve.outputs.revisions)['opendaq'] }}
      exclude-jobs: ${{ needs.resolve.outputs.exclude-jobs }}

  stage-asam-cmp-modules:
    name: Stage ASAM-CMP-Modules
    needs: [resolve, pull, stage-opendaq]
    if: >-
      always() && needs.resolve.result == 'success'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.pull.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.stage-opendaq.result)
      && contains(fromJSON(needs.resolve.outputs.missing), 'asam-cmp-modules')
    permissions:
      contents: read
      packages: write     # asked for by the stage.yml's push, which is never run from here
    uses: openDAQ/ASAM-CMP-Modules/.github/workflows/stage.yml@bundle/stagings
    with:
      ref: ${{ fromJSON(needs.resolve.outputs.revisions)['asam-cmp-modules'] }}
      opendaq-ref: ${{ fromJSON(needs.resolve.outputs.revisions)['opendaq'] }}
      exclude-jobs: ${{ needs.resolve.outputs.exclude-jobs }}
