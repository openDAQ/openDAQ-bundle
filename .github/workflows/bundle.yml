name: Bundle

# The bundle's installers: resolve.yml lays the stagings of the bundle's commits into this run, assemble.yml builds
# the installers from them. A layer's revision can be given as an input (a commit, or a branch or tag taken at its
# head now), in place of bundle.json's; a module can be left out (exclude-stagings). Called by the bundle's own
# triggers and by a layer's CI. The installers are published to ghcr.io/<owner>/bundle/native only from the bundle's
# main and release/**, as bundle.json has them: never from a pull request, an input given, or another repository.

on:
  workflow_dispatch:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      mqtt-module:
        description: "MQTTStreamingModule: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      asam-cmp-modules:
        description: "ASAM-CMP-Modules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      exclude-stagings:
        description: "Stagings left out of the bundle, e.g. opcua-modules (;-separated; never opendaq)"
        type: string
        default: ""
  workflow_call:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      mqtt-module:
        description: "MQTTStreamingModule: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      asam-cmp-modules:
        description: "ASAM-CMP-Modules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      exclude-stagings:
        description: "Stagings left out of the bundle, e.g. opcua-modules (;-separated; never opendaq)"
        type: string
        default: ""
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    name: Resolve stagings
    permissions:
      contents: read
      packages: write     # a missing staging's stage.yml asks for it; nothing is pushed from here
    uses: ./.github/workflows/resolve.yml
    with:
      opendaq: ${{ inputs.opendaq }}
      opcua-modules: ${{ inputs.opcua-modules }}
      mqtt-module: ${{ inputs.mqtt-module }}
      lt-streaming-modules: ${{ inputs.lt-streaming-modules }}
      asam-cmp-modules: ${{ inputs.asam-cmp-modules }}
      exclude-stagings: ${{ inputs.exclude-stagings }}

  assemble:
    name: Assemble bundle
    needs: resolve
    uses: ./.github/workflows/assemble.yml
    with:
      revisions: ${{ needs.resolve.outputs.revisions }}
      platforms: ${{ needs.resolve.outputs.platforms }}

  publish:
    name: Publish bundle
    needs: assemble
    if: >-
      github.repository == 'openDAQ/openDAQ-bundle' && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
      && format('{0}{1}{2}{3}{4}{5}', inputs.opendaq, inputs.opcua-modules, inputs.mqtt-module,
                inputs.lt-streaming-modules, inputs.asam-cmp-modules, inputs.exclude-stagings) == ''
    permissions:
      contents: read
      packages: write
    uses: openDAQ/openDAQ-CI/.github/workflows/staging-push.yml@v4
    with:
      staging-packages: ${{ needs.assemble.outputs.staging-push }}
