name: Bundle

# The bundle's installers: resolve.yml lays the stagings of the bundle's commits into this run, assemble.yml builds
# the installers from them. A layer's revision can be given as an input (a commit, or a branch or tag taken at its
# head now), in place of bundle.json's; a module can be left out (exclude-stagings). Called by the bundle's own
# triggers and by a layer's CI. The installers are published to ghcr.io/<owner>/bundle/native only from the bundle's
# main and release/**, by a push or by hand (the inputs given make an identity of their own; skip-staging-push
# builds only): never from a pull request or another repository.
#
# Temporary, on bundle/integration-test-removal, the target of openDAQ-CI's integration-tests.yml: one platform,
# ubuntu-22.04 x86_64 gcc (resolve.yml's JOBS), and the stagings the integration tests load, opendaq, opcua-modules and
# lt-streaming-modules (exclude-stagings' default); everything else is neither pulled, staged nor packed. A layer
# staged here treats no compiler warning as an error (warnings-as-errors' default), so a module built against a newer
# core does not fail on its new warnings. A caller grants "packages: write": the layers' stage.yml ask for it (their
# push, never run from here).

on:
  workflow_dispatch:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      mqtt-module:
        description: "MQTTStreamingModule: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      asam-cmp-modules:
        description: "ASAM-CMP-Modules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      exclude-stagings:
        description: "Stagings left out of the bundle, e.g. opcua-modules (;-separated; never opendaq). Temporary default: those the integration tests do not load"
        type: string
        default: "mqtt-module;asam-cmp-modules"
      warnings-as-errors:
        description: "Compiler warnings fail the layers staged in this run (<prefix>_RELEASE_WARNINGS_AS_ERRORS). Temporary default: false"
        type: boolean
        default: false
      skip-staging-push:
        description: "Build only, keep the installers as artifacts of the run"
        type: boolean
        default: false
  workflow_call:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      mqtt-module:
        description: "MQTTStreamingModule: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      asam-cmp-modules:
        description: "ASAM-CMP-Modules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      exclude-stagings:
        description: "Stagings left out of the bundle, e.g. opcua-modules (;-separated; never opendaq). Temporary default: those the integration tests do not load"
        type: string
        default: "mqtt-module;asam-cmp-modules"
      warnings-as-errors:
        description: "Compiler warnings fail the layers staged in this run (<prefix>_RELEASE_WARNINGS_AS_ERRORS). Temporary default: false"
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    name: Resolve stagings
    permissions:
      contents: read
      packages: write     # a missing staging's stage.yml asks for it; nothing is pushed from here
    uses: ./.github/workflows/resolve.yml
    with:
      opendaq: ${{ inputs.opendaq }}
      opcua-modules: ${{ inputs.opcua-modules }}
      mqtt-module: ${{ inputs.mqtt-module }}
      lt-streaming-modules: ${{ inputs.lt-streaming-modules }}
      asam-cmp-modules: ${{ inputs.asam-cmp-modules }}
      exclude-stagings: ${{ inputs.exclude-stagings }}
      warnings-as-errors: ${{ inputs.warnings-as-errors }}     # push and pull_request have no inputs: ''

  assemble:
    name: Assemble bundle
    needs: resolve
    uses: ./.github/workflows/assemble.yml
    with:
      revisions: ${{ needs.resolve.outputs.revisions }}
      platforms: ${{ needs.resolve.outputs.platforms }}

  publish:
    name: Publish bundle
    needs: assemble
    if: >-
      github.repository == 'openDAQ/openDAQ-bundle' && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && !inputs.skip-staging-push
    permissions:
      contents: read
      packages: write
    uses: openDAQ/openDAQ-CI/.github/workflows/staging-push.yml@v4
    with:
      staging-packages: ${{ needs.assemble.outputs.staging-push }}
