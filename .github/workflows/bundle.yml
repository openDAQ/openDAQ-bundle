name: Bundle

# The bundle's installers: resolve.yml lays the stagings of the bundle's commits into this run, assemble.yml builds
# the installers from them. A layer's revision can be given as an input (a commit, or a branch or tag taken at its
# head now), in place of bundle.json's. Called by the bundle's own triggers and by a layer's CI.

on:
  workflow_dispatch:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      mqtt-module:
        description: "MQTTStreamingModule: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      asam-cmp-modules:
        description: "ASAM-CMP-Modules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      runs:
        description: 'Stagings staged in another run, not pulled: {"opcua-modules": {"repository": "openDAQ/OpcUaModules", "run-id": 1}}'
        type: string
        default: "{}"
  workflow_call:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      mqtt-module:
        description: "MQTTStreamingModule: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      asam-cmp-modules:
        description: "ASAM-CMP-Modules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      runs:
        description: 'Stagings staged in another run, not pulled: {"opcua-modules": {"repository": "openDAQ/OpcUaModules", "run-id": 1}}'
        type: string
        default: "{}"
  pull_request:

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  resolve:
    name: Resolve
    uses: ./.github/workflows/resolve.yml
    with:
      opendaq: ${{ inputs.opendaq }}
      opcua-modules: ${{ inputs.opcua-modules }}
      mqtt-module: ${{ inputs.mqtt-module }}
      lt-streaming-modules: ${{ inputs.lt-streaming-modules }}
      asam-cmp-modules: ${{ inputs.asam-cmp-modules }}
      runs: ${{ inputs.runs || '{}' }}

  assemble:
    name: Assemble
    needs: resolve
    uses: ./.github/workflows/assemble.yml
    with:
      revisions: ${{ needs.resolve.outputs.revisions }}
      platforms: ${{ needs.resolve.outputs.platforms }}
