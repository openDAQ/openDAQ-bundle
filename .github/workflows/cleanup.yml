name: Clean up bundles

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be pruned without deleting."
        type: boolean
        default: false

jobs:
  cleanup:
    name: Installers
    permissions:
      packages: write
    uses: openDAQ/openDAQ-CI/.github/workflows/staging-cleanup.yml@v4
    with:
      dry-run: ${{ inputs.dry-run || false }}
      staging-retentions: >-
        [
          { "path": "ghcr.io/openDAQ/bundle/native", "retention": { "days": 30 } }
        ]
