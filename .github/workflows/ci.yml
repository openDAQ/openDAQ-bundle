name: CI

# The bundle of a pull request, or of the commits given by hand or by a layer's CI, built by bundle.yml and checked:
# each installer installed as a user would and smoke-checked by tests/installed. Nothing is published.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      mqtt-module:
        description: "MQTTStreamingModule: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      asam-cmp-modules:
        description: "ASAM-CMP-Modules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      exclude-stagings:
        description: "Stagings left out of the bundle, e.g. opcua-modules (;-separated; never opendaq)"
        type: string
        default: ""
  workflow_call:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      mqtt-module:
        description: "MQTTStreamingModule: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      asam-cmp-modules:
        description: "ASAM-CMP-Modules: a commit, branch or tag (empty: bundle.json's)"
        type: string
        default: ""
      exclude-stagings:
        description: "Stagings left out of the bundle, e.g. opcua-modules (;-separated; never opendaq)"
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  bundle:
    name: Bundle
    permissions:
      contents: read
      packages: write     # a missing staging's stage.yml asks for it; nothing is pushed from here
    uses: ./.github/workflows/bundle.yml
    with:
      opendaq: ${{ inputs.opendaq }}
      opcua-modules: ${{ inputs.opcua-modules }}
      mqtt-module: ${{ inputs.mqtt-module }}
      lt-streaming-modules: ${{ inputs.lt-streaming-modules }}
      asam-cmp-modules: ${{ inputs.asam-cmp-modules }}
      exclude-stagings: ${{ inputs.exclude-stagings }}

  # each installer installed as a user would, everything selected, and smoke-checked by tests/installed
  check:
    name: Check ${{ matrix.check.job }}
    needs: bundle
    runs-on: ${{ matrix.check.runner }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.bundle.outputs.checks) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.check.job }}
          path: installer

      - name: Install
        id: install
        timeout-minutes: 10
        run: |
          find installer -type f
          case "${{ matrix.check.generator }}" in
            DEB)          sudo apt-get update -qq
                          sudo apt-get install -y -qq "$(find "$PWD/installer" -name '*.deb' | head -1)"
                          echo "prefix=/opt/opendaq" >> "$GITHUB_OUTPUT" ;;
            productbuild) sudo installer -pkg "$(find installer -name '*.pkg' | head -1)" -target /
                          echo "prefix=/opt/opendaq" >> "$GITHUB_OUTPUT" ;;
            NSIS)         exe=$(cygpath -w "$(find installer -name '*.exe' | head -1)")
                          pwsh -Command 'Write-Host "PATH: $($env:Path.Length) characters (the template reads 1024)"'
                          pwsh -Command "Start-Process -Wait -FilePath '$exe' -ArgumentList '/S','/PATH=AllUsers','/D=C:\opendaq'"
                          echo "prefix=C:/opendaq" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Smoke check
        run: |
          cmake -S tests/installed -B build/installed -DOPENDAQ_PREFIX=${{ steps.install.outputs.prefix }}
          cmake --build build/installed --config Release
          ctest --test-dir build/installed -C Release --verbose 2>&1 | tee smoke.log      # --verbose: the log lists each module loaded, which Summary reads
          exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always() && steps.install.outcome == 'success'
        run: |
          tr -d '\r' < smoke.log > smoke.txt
          {
            echo "### ${{ matrix.check.job }}"
            echo
            echo "Installer: \`$(basename "$(find installer -type f \( -name '*.deb' -o -name '*.pkg' -o -name '*.exe' \) | head -1)")\`"
            echo
            echo "| Test | Modules | Not loaded |"
            echo "|-|-|-|"
            sed -nE 's/^ *Start +([0-9]+): (.*)$/\1 \2/p' smoke.txt | while read -r n name; do
              count=$(sed -nE "s/^$n: ([0-9]+) modules$/\1/p" smoke.txt | tail -1)
              failed=$(sed -nE "s/^$n: .*Error loading module \"([^\"]*)\".*/\1/p" smoke.txt | sed -E 's#.*[/\\]##' | sort -u | paste -sd ' ' -)
              echo "| $name | ${count:-none} | ${failed:-} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # the installer added its bin to the machine's PATH, and the uninstaller removes it
      - name: PATH
        if: matrix.check.generator == 'NSIS'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $bin = 'C:\opendaq\bin'
          $has = { ([Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';') -contains $bin }
          Write-Host "after install, machine PATH has ${bin}: $(& $has)"
          if (-not (& $has)) { exit 1 }
          Start-Process -Wait -FilePath 'C:\opendaq\Uninstall.exe' -ArgumentList '/S','_?=C:\opendaq'
          Write-Host "after uninstall, machine PATH has ${bin}: $(& $has)"
          if (& $has) { exit 1 }
